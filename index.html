    <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EbookForge — Créateur d'ebooks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:wght@400;700;900&family=Lora:wght@400;600;700&family=Crimson+Text:wght@400;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0F;--panel:#14141C;--panel2:#1B1B26;--border:#26263A;--text:#F5F5F7;--muted:#8A8A99;--accent:#FF3366;--accent2:#7C4DFF;--ok:#19C37D}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,.95);backdrop-filter:blur(10px);z-index:10;flex-wrap:wrap}
header .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff}
header h1{font-size:17px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
header h1 .pro{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:10px;border:1px solid var(--accent);padding:2px 6px;border-radius:6px;-webkit-text-fill-color:transparent}
header .tag{font-size:12px;color:var(--muted);margin-left:auto}
.layout{display:grid;grid-template-columns:1fr 480px;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 12px 0;font-weight:700}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px;font-weight:600}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;resize:vertical}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:180px;line-height:1.6;font-size:13px}
input[type=range]{width:100%;margin:6px 0}
input[type=color]{width:100%;height:42px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);cursor:pointer;padding:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{cursor:pointer;border:none;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;font-family:inherit;transition:.15s;color:var(--text);background:var(--panel2);border:1px solid var(--border)}
.btn:hover{border-color:var(--accent)}
.btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;padding:14px;font-size:15px;width:100%;cursor:pointer;color:#fff;font-weight:800;border-radius:10px}
.btn-primary:hover{opacity:.9}
.btn-ok{background:var(--ok);color:#000;border:none;font-weight:800}
.templates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{cursor:pointer;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;transition:.15s}
.tpl:hover{border-color:var(--accent)}
.tpl.active{border-color:var(--accent);background:#221022}
.tpl .t{font-size:13px;font-weight:700;margin-bottom:2px}
.tpl .d{font-size:11px;color:var(--muted);line-height:1.3}
.chapters{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:300px;overflow-y:auto}
.chapter-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.15s}
.chapter-item:hover{border-color:var(--accent)}
.chapter-item.active{border-color:var(--accent);background:#221022}
.chapter-item .num{font-size:11px;color:var(--accent);font-weight:900;min-width:20px}
.chapter-item .name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chapter-item .del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px}
.chapter-item .del:hover{color:var(--accent)}
.file-drop{border:2px dashed var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;transition:.15s}
.file-drop:hover{border-color:var(--accent);color:var(--text)}
.file-drop input{display:none}
.images-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.img-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--border)}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-thumb .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.75);border:none;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}
.preview-wrap{position:sticky;top:80px}
.preview-nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.preview-nav .btn{flex:1;font-size:11px;padding:8px 4px;min-width:0}
.page-viewer{background:#222;border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;justify-content:center;min-height:500px}
.page{width:420px;max-width:100%;aspect-ratio:210/297;background:#FDFDF8;color:#1A1A1A;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden;position:relative}
.page-inner{width:100%;height:100%;padding:38px 34px;overflow:hidden;position:relative}
.page.tpl-classic{--h:'Playfair Display',serif;--b:'Lora',serif;--align:justify}
.page.tpl-modern{--h:'Inter',sans-serif;--b:'Inter',sans-serif;--align:left}
.page.tpl-romance{--h:'Playfair Display',serif;--b:'Crimson Text',serif;--align:justify}
.page.tpl-minimal{--h:'Inter',sans-serif;--b:'Inter',sans-serif;--align:left}
.page-cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;background-size:cover;background-position:center;position:relative;padding:40px 30px;height:100%}
.page-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.35),rgba(0,0,0,.65));z-index:0}
.page-cover .content{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;height:100%;width:100%}
.page-cover .top{font-size:10px;letter-spacing:3px;opacity:.7;text-transform:uppercase}
.page-cover .mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.page-cover h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:900;margin:0 0 12px 0;line-height:1.15;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.page-cover .sub{font-family:'Lora',serif;font-style:italic;font-size:15px;opacity:.9;margin:0 0 24px 0}
.page-cover .author{font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.page-toc h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;margin:0 0 24px 0;text-align:center;color:#1A1A1A}
.page-toc ol{list-style:none;padding:0;margin:0;counter-reset:toc}
.page-toc li{counter-increment:toc;padding:9px 0;border-bottom:1px dotted #CCC;display:flex;gap:14px;font-family:'Lora',serif;font-size:13px;color:#2A2A2A}
.page-toc li::before{content:counter(toc);font-weight:900;color:var(--accent,#FF3366);min-width:24px;font-family:'Inter',sans-serif}
.page-chapter .chapter-num{display:none}
.page-chapter h2{font-family:var(--h,'Playfair Display',serif);font-size:24px;font-weight:900;margin:0 0 20px 0;line-height:1.15;color:#111}
.page-chapter h3{font-family:var(--h,'Playfair Display',serif);font-size:16px;font-weight:700;margin:18px 0 8px 0;color:#333}
.page-chapter p{font-family:var(--b,'Lora',serif);font-size:12px;line-height:1.65;margin:0 0 10px 0;text-align:var(--align,justify);color:#2A2A2A}
.page-chapter .illus{margin:14px 0;text-align:center}
.page-chapter .illus img{max-width:100%;max-height:180px;border-radius:4px;object-fit:cover}
.page-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-family:'Inter',sans-serif;font-size:13px;text-align:center;padding:20px}
.status{font-size:12px;color:var(--muted);margin-top:8px;text-align:center;min-height:16px}
.status.ok{color:var(--ok)}
.word-count{font-size:11px;color:var(--muted);text-align:right;margin-top:6px}
.info-box{background:#0E1620;border:1px solid #1F3050;border-radius:10px;padding:10px;font-size:12px;color:#A8C8F0;margin-bottom:12px;line-height:1.5}
#printContainer{display:none}
@media print{
  body>*:not(#printContainer){display:none!important}
  #printContainer{display:block!important}
  #printContainer .print-page{width:210mm;height:297mm;page-break-after:always;overflow:hidden;background:#fff;color:#1A1A1A;position:relative}
  #printContainer .print-page:last-child{page-break-after:auto}
  #printContainer .page-inner{padding:18mm 16mm}
  #printContainer .page-cover{background:#1A1A2E}
  #printContainer .page-chapter h2{font-size:24pt}
  #printContainer .page-chapter p{font-size:11pt}
  #printContainer .page-cover h1{font-size:34pt}
  @page{size:A4;margin:0}
}
</style>
</head>

  <body>

<header>
  <div class="logo">📖</div>
  <h1>EbookForge <span class="pro">PRO</span></h1>
  <span class="tag">Crée ton ebook illustré</span>
</header>

<div class="layout">
  <div class="controls">
    <div class="info-box">
      💡 <b>Astuce :</b> ton livre est <b>sauvegardé automatiquement</b>. Tu peux fermer et revenir plus tard.
    </div>

    <div class="panel">
      <h2>1 · Informations du livre</h2>
      <label>Titre</label>
      <input type="text" id="metaTitle" placeholder="Mon premier ebook" />
      <label>Sous-titre (optionnel)</label>
      <input type="text" id="metaSubtitle" placeholder="Un guide pratique" />
      <label>Auteur</label>
      <input type="text" id="metaAuthor" placeholder="Ton nom" />
      <label>Couleur de couverture</label>
      <div class="row">
        <input type="color" id="coverColor1" value="#FF3366" />
        <input type="color" id="coverColor2" value="#7C4DFF" />
      </div>
      <label>Ou image de couverture</label>
      <label class="file-drop" for="coverImage">🖼️ Choisir une image
        <input type="file" id="coverImage" accept="image/*" />
      </label>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="btnCoverClear">Retirer l'image</button>
        <button class="btn" id="btnCoverRandom">Couleur aléatoire</button>
      </div>
    </div>

    <div class="panel">
      <h2>2 · Mise en page</h2>
      <label>Modèle</label>
      <div class="templates" id="templates"></div>
      <label>Couleur d'accent</label>
      <input type="color" id="accentColor" value="#FF3366" />
      <label>Police d'écriture</label>
      <select id="fontSelect">
        <option value="classic">Classique (Playfair + Lora)</option>
        <option value="modern">Moderne (Inter)</option>
        <option value="romance">Roman (Crimson)</option>
        <option value="merriweather">Merriweather (élégant)</option>
        <option value="mixed">Mixte (Playfair titre + Inter texte)</option>
      </select>
      <label>Taille du texte : <span id="fontSizeLabel">12pt</span></label>
      <input type="range" id="fontSize" min="9" max="32" value="12" />
      <label>Interligne : <span id="lineHeightLabel">1.65</span></label>
      <input type="range" id="lineHeight" min="120" max="220" value="165" />
    </div>

    <div class="panel">
      <h2>3 · Chapitres</h2>
      <div class="chapters" id="chaptersList"></div>
      <button class="btn" id="btnAddChapter" style="width:100%">+ Ajouter un chapitre</button>
    </div>

    <div class="panel" id="editorPanel">
      <h2>4 · Éditer le chapitre</h2>
      <label>Titre du chapitre</label>
      <input type="text" id="chapterTitle" placeholder="Titre du chapitre" />
      <label>Texte</label>
      <textarea id="chapterContent" placeholder="Écris ton texte ici..."></textarea>
      <label>Images illustratives</label>
      <label class="file-drop" for="chapterImages">🖼️ Ajouter des images
        <input type="file" id="chapterImages" accept="image/*" multiple />
      </label>
      <div class="images-grid" id="chapterImagesGrid"></div>
      <label style="margin-top:12px">Position des images</label>
      <div class="row3" id="imgPosition"></div>
      <div class="word-count" id="wordCount"></div>
    </div>

    <div class="panel">
      <h2>5 · Actions</h2>
      <button class="btn-primary" id="btnExportPDF">📕 Exporter en PDF</button>
      <div class="row" style="margin-top:8px">
        <button class="btn btn-ok" id="btnSaveJSON">💾 Sauvegarder</button>
        <button class="btn" id="btnLoadJSON">📂 Charger</button>
      </div>
      <input type="file" id="fileLoadJSON" accept=".json,application/json" style="display:none" />
      <button class="btn" id="btnNewBook" style="width:100%;margin-top:8px">🗑️ Nouveau livre</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="panel">
      <h2>Aperçu live</h2>
      <div class="preview-nav">
        <button class="btn" data-view="cover">Couverture</button>
        <button class="btn" data-view="toc">Sommaire</button>
        <button class="btn" data-view="chapter">Chapitre</button>
      </div>
      <div class="page-viewer">
        <div id="previewPage"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="btnPrev">← Précédent</button>
        <button class="btn" id="btnNext">Suivant →</button>
      </div>
      <div class="status" id="previewStatus"></div>
    </div>
  </div>
</div>

<div id="printContainer"></div>

    <script>
const TEMPLATES = {
  classic: { name: 'Classique', desc: 'Playfair + Lora, élégant' },
  modern: { name: 'Moderne', desc: 'Inter, aéré et net' },
  romance: { name: 'Roman', desc: 'Crimson, traditionnel' },
  minimal: { name: 'Minimaliste', desc: 'Inter, épuré' }
};

const state = {
  meta: {
    title: 'Mon premier ebook',
    subtitle: 'Un guide pratique',
    author: 'Auteur',
    coverColor1: '#FF3366',
    coverColor2: '#7C4DFF',
    coverImage: null
  },
  design: {
    template: 'classic',
    accent: '#FF3366',
    fontSelect: 'classic',
    fontSize: 12,
    lineHeight: 1.65
  },
  chapters: [
    { id: Date.now(), title: 'Introduction', content: 'Bienvenue dans ce livre.', images: [], imagePosition: 'top' }
  ],
  view: 'cover',
  currentChapter: 0
};

const $ = id => document.getElementById(id);

function saveLocal() {
  try {
    localStorage.setItem('ebookforge_state', JSON.stringify(state));
    setStatus('💾 Sauvegardé', 'ok');
  } catch (e) { setStatus('⚠️ Stockage plein', ''); }
}
function loadLocal() {
  try {
    const s = localStorage.getItem('ebookforge_state');
    if (s) Object.assign(state, JSON.parse(s));
  } catch (e) { console.warn(e); }
}
let saveTimer;
function saveDelayed() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 800);
}
function setStatus(msg, cls) {
  const el = $('status');
  if (el) { el.textContent = msg; el.className = 'status ' + (cls || ''); }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatText(text) {
  if (!text) return '';
  return text.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('## ')) return '<h3>' + escapeHTML(p.slice(3)) + '</h3>';
    if (p.startsWith('# ')) return '<h2>' + escapeHTML(p.slice(2)) + '</h2>';
    let h = escapeHTML(p);
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return '<p>' + h + '</p>';
  }).join('');
}

function getFonts() {
  const map = {
    classic: { h: "'Playfair Display', serif", b: "'Lora', serif" },
    modern: { h: "'Inter', sans-serif", b: "'Inter', sans-serif" },
    romance: { h: "'Playfair Display', serif", b: "'Crimson Text', serif" },
    merriweather: { h: "'Merriweather', serif", b: "'Merriweather', serif" },
    mixed: { h: "'Playfair Display', serif", b: "'Inter', sans-serif" }
  };
  return map[state.design.fontSelect || 'classic'] || map.classic;
}

function applyFont() {
  const f = getFonts();
  document.querySelectorAll('.page-chapter h2, .page-chapter h3').forEach(el => { el.style.fontFamily = f.h; });
  document.querySelectorAll('.page-chapter p').forEach(el => { el.style.fontFamily = f.b; });
  document.querySelectorAll('#printContainer .page-chapter h2, #printContainer .page-chapter h3').forEach(el => { el.style.fontFamily = f.h; });
  document.querySelectorAll('#printContainer .page-chapter p').forEach(el => { el.style.fontFamily = f.b; });
}

function buildCoverHTML() {
  const m = state.meta;
  const bg = m.coverImage
    ? "background-image:url('" + m.coverImage + "')"
    : 'background:linear-gradient(135deg,' + m.coverColor1 + ',' + m.coverColor2 + ')';
  return '<div class="page" style="padding:0"><div class="page-cover" style="' + bg + '"><div class="content"><div class="top">Ebook</div><div class="mid"><h1>' + escapeHTML(m.title || 'Sans titre') + '</h1>' + (m.subtitle ? '<div class="sub">' + escapeHTML(m.subtitle) + '</div>' : '') + '</div><div class="author">' + escapeHTML(m.author || '') + '</div></div></div></div>';
}

function buildTOCHTML() {
  const list = state.chapters.map(c => '<li><span style="flex:1">' + escapeHTML(c.title || 'Sans titre') + '</span></li>').join('');
  return '<div class="page tpl-' + state.design.template + '" style="--accent:' + state.design.accent + '"><div class="page-inner"><div class="page-toc"><h1>Sommaire</h1><ol>' + list + '</ol></div></div></div>';
}

function buildChapterHTML(idx) {
  const ch = state.chapters[idx];
  if (!ch) return '';
  const imgs = (ch.images || []).map(im => '<div class="illus"><img src="' + im.src + '" alt=""/></div>').join('');
  const pos = ch.imagePosition || 'top';
  return '<div class="page tpl-' + state.design.template + '" style="--accent:' + state.design.accent + '"><div class="page-inner"><div class="page-chapter"><h2>' + escapeHTML(ch.title || 'Sans titre') + '</h2>' + (pos === 'top' ? imgs : '') + '<div class="chapter-text">' + formatText(ch.content) + '</div>' + (pos === 'bottom' ? imgs : '') + '</div></div></div>';
}

function buildCurrentPreview() {
  let html = '';
  if (state.view === 'cover') html = buildCoverHTML();
  else if (state.view === 'toc') html = buildTOCHTML();
  else html = buildChapterHTML(state.currentChapter);
  $('previewPage').innerHTML = html;
  const page = $('previewPage').querySelector('.page-chapter');
  if (page) {
    page.querySelectorAll('p').forEach(p => {
      p.style.fontSize = state.design.fontSize + 'px';
      p.style.lineHeight = state.design.lineHeight;
    });
  }
  applyFont();
  const total = 2 + state.chapters.length;
  const cur = state.view === 'cover' ? 1 : (state.view === 'toc' ? 2 : 3 + state.currentChapter);
  $('previewStatus').textContent = 'Page ' + cur + ' / ' + total;
  document.querySelectorAll('[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
  });
}

function renderTemplates() {
  const el = $('templates');
  el.innerHTML = '';
  Object.entries(TEMPLATES).forEach(([k, t]) => {
    const d = document.createElement('div');
    d.className = 'tpl' + (k === state.design.template ? ' active' : '');
    d.innerHTML = '<div class="t">' + t.name + '</div><div class="d">' + t.desc + '</div>';
    d.onclick = () => {
      state.design.template = k;
      renderTemplates();
      buildCurrentPreview();
      saveDelayed();
    };
    el.appendChild(d);
  });
}

function renderChapters() {
  const el = $('chaptersList');
  el.innerHTML = '';
  state.chapters.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'chapter-item' + (i === state.currentChapter ? ' active' : '');
    d.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="name">' + escapeHTML(c.title || 'Sans titre') + '</span><button class="del" data-i="' + i + '">✕</button>';
    d.onclick = (e) => {
      if (e.target.classList.contains('del')) {
        if (state.chapters.length <= 1) { alert('Garde au moins un chapitre.'); return; }
        if (!confirm('Supprimer ce chapitre ?')) return;
        state.chapters.splice(+e.target.dataset.i, 1);
        if (state.currentChapter >= state.chapters.length) state.currentChapter = state.chapters.length - 1;
        renderChapters();
        loadChapterIntoEditor();
        buildCurrentPreview();
        saveDelayed();
        return;
      }
      state.currentChapter = i;
      state.view = 'chapter';
      renderChapters();
      loadChapterIntoEditor();
      buildCurrentPreview();
    };
    el.appendChild(d);
  });
}

function renderChapterImages() {
  const el = $('chapterImagesGrid');
  const ch = state.chapters[state.currentChapter];
  el.innerHTML = '';
  if (!ch) return;
  (ch.images || []).forEach((im, i) => {
    const d = document.createElement('div');
    d.className = 'img-thumb';
    d.innerHTML = '<img src="' + im.src + '"/><button class="x" data-i="' + i + '">✕</button>';
    el.appendChild(d);
  });
  el.querySelectorAll('.x').forEach(b => {
    b.onclick = () => {
      ch.images.splice(+b.dataset.i, 1);
      renderChapterImages();
      buildCurrentPreview();
      saveDelayed();
    };
  });
}

function renderImagePosition() {
  const el = $('imgPosition');
  const ch = state.chapters[state.currentChapter];
  el.innerHTML = '';
  [['top', 'Avant texte'], ['bottom', 'Après texte']].forEach(([k, lb]) => {
    const b = document.createElement('button');
    b.className = 'btn' + ((ch.imagePosition || 'top') === k ? ' active' : '');
    b.textContent = lb;
    b.onclick = () => {
      ch.imagePosition = k;
      renderImagePosition();
      buildCurrentPreview();
      saveDelayed();
    };
    el.appendChild(b);
  });
}

function updateWordCount() {
  const ch = state.chapters[state.currentChapter];
  if (!ch) return;
  const words = (ch.content || '').trim().split(/\s+/).filter(w => w).length;
  $('wordCount').textContent = words + ' mots · ' + (ch.content || '').length + ' caractères';
}

function loadChapterIntoEditor() {
  const ch = state.chapters[state.currentChapter];
  if (!ch) return;
  $('chapterTitle').value = ch.title || '';
  $('chapterContent').value = ch.content || '';
  renderChapterImages();
  renderImagePosition();
  updateWordCount();
}

function loadMetaIntoUI() {
  $('metaTitle').value = state.meta.title || '';
  $('metaSubtitle').value = state.meta.subtitle || '';
  $('metaAuthor').value = state.meta.author || '';
  $('coverColor1').value = state.meta.coverColor1;
  $('coverColor2').value = state.meta.coverColor2;
  $('accentColor').value = state.design.accent;
  $('fontSelect').value = state.design.fontSelect || 'classic';
  $('fontSize').value = state.design.fontSize;
  $('fontSizeLabel').textContent = state.design.fontSize + 'pt';
  $('lineHeight').value = Math.round(state.design.lineHeight * 100);
  $('lineHeightLabel').textContent = state.design.lineHeight.toFixed(2);
}

function fileToResizedDataURL(file, maxW) {
  maxW = maxW || 1200;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}

$('metaTitle').addEventListener('input', e => { state.meta.title = e.target.value; buildCurrentPreview(); saveDelayed(); });
$('metaSubtitle').addEventListener('input', e => { state.meta.subtitle = e.target.value; buildCurrentPreview(); saveDelayed(); });
$('metaAuthor').addEventListener('input', e => { state.meta.author = e.target.value; buildCurrentPreview(); saveDelayed(); });
['coverColor1', 'coverColor2'].forEach(id => {
  $(id).addEventListener('input', e => {
    state.meta[id] = e.target.value;
    buildCurrentPreview();
    saveDelayed();
  });
});
$('accentColor').addEventListener('input', e => {
  state.design.accent = e.target.value;
  buildCurrentPreview();
  saveDelayed();
});
$('fontSelect').addEventListener('change', e => {
  state.design.fontSelect = e.target.value;
  applyFont();
  saveDelayed();
});
$('fontSize').addEventListener('input', e => {
  state.design.fontSize = parseInt(e.target.value);
  $('fontSizeLabel').textContent = state.design.fontSize + 'pt';
  buildCurrentPreview();
  saveDelayed();
});
$('lineHeight').addEventListener('input', e => {
  state.design.lineHeight = parseInt(e.target.value) / 100;
  $('lineHeightLabel').textContent = state.design.lineHeight.toFixed(2);
  buildCurrentPreview();
  saveDelayed();
});

$('coverImage').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    state.meta.coverImage = await fileToResizedDataURL(f, 1000);
    buildCurrentPreview();
    saveDelayed();
  } catch (err) { alert('Erreur image'); }
});
$('btnCoverClear').onclick = () => {
  state.meta.coverImage = null;
  buildCurrentPreview();
  saveDelayed();
};
$('btnCoverRandom').onclick = () => {
  const h = Math.floor(Math.random() * 360);
  const c1 = hslToHex(h, 75, 55);
  const c2 = hslToHex((h + 40) % 360, 75, 45);
  state.meta.coverColor1 = c1;
  state.meta.coverColor2 = c2;
  $('coverColor1').value = c1;
  $('coverColor2').value = c2;
  buildCurrentPreview();
  saveDelayed();
};

$('chapterTitle').addEventListener('input', e => {
  const ch = state.chapters[state.currentChapter];
  if (!ch) return;
  ch.title = e.target.value;
  renderChapters();
  buildCurrentPreview();
  saveDelayed();
});
$('chapterContent').addEventListener('input', e => {
  const ch = state.chapters[state.currentChapter];
  if (!ch) return;
  ch.content = e.target.value;
  updateWordCount();
  buildCurrentPreview();
  saveDelayed();
});
$('chapterImages').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  const ch = state.chapters[state.currentChapter];
  if (!ch) return;
  for (const f of files) {
    try {
      const src = await fileToResizedDataURL(f, 1000);
      ch.images.push({ src: src });
    } catch (err) { console.warn(err); }
  }
  renderChapterImages();
  buildCurrentPreview();
  saveDelayed();
});

$('btnAddChapter').onclick = () => {
  state.chapters.push({ id: Date.now(), title: 'Nouveau chapitre', content: '', images: [], imagePosition: 'top' });
  state.currentChapter = state.chapters.length - 1;
  state.view = 'chapter';
  renderChapters();
  loadChapterIntoEditor();
  buildCurrentPreview();
  saveDelayed();
};

document.querySelectorAll('[data-view]').forEach(b => {
  b.onclick = () => { state.view = b.dataset.view; buildCurrentPreview(); };
});
$('btnPrev').onclick = () => {
  if (state.view === 'cover') return;
  if (state.view === 'toc') { state.view = 'cover'; buildCurrentPreview(); return; }
  if (state.currentChapter > 0) {
    state.currentChapter--;
    loadChapterIntoEditor();
    renderChapters();
  } else { state.view = 'toc'; }
  buildCurrentPreview();
};
$('btnNext').onclick = () => {
  if (state.view === 'cover') { state.view = 'toc'; buildCurrentPreview(); return; }
  if (state.view === 'toc') {
    state.view = 'chapter';
    state.currentChapter = 0;
    loadChapterIntoEditor();
    renderChapters();
  } else if (state.currentChapter < state.chapters.length - 1) {
    state.currentChapter++;
    loadChapterIntoEditor();
    renderChapters();
  }
  buildCurrentPreview();
};

$('btnExportPDF').onclick = () => {
  setStatus('📕 Préparation du PDF…', 'ok');
  const all = [buildCoverHTML(), buildTOCHTML()];
  state.chapters.forEach((c, i) => all.push(buildChapterHTML(i)));
  const html = all.map(p => '<div class="print-page">' + p + '</div>').join('');
  $('printContainer').innerHTML = html;
  $('printContainer').querySelectorAll('.page-chapter p').forEach(p => {
    p.style.fontSize = state.design.fontSize + 'pt';
    p.style.lineHeight = state.design.lineHeight;
  });
  applyFont();
  setTimeout(() => {
    window.print();
    setStatus('✅ PDF prêt', 'ok');
  }, 300);
};

$('btnSaveJSON').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ebook-' + Date.now() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  setStatus('💾 Fichier téléchargé', 'ok');
};
$('btnLoadJSON').onclick = () => $('fileLoadJSON').click();
$('fileLoadJSON').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      Object.assign(state, JSON.parse(r.result));
      loadMetaIntoUI();
      renderTemplates();
      renderChapters();
      loadChapterIntoEditor();
      buildCurrentPreview();
      saveDelayed();
      setStatus('✅ Livre chargé', 'ok');
    } catch (err) { alert('Fichier invalide'); }
  };
  r.readAsText(f);
});
$('btnNewBook').onclick = () => {
  if (!confirm('Effacer TOUT le livre actuel et repartir de zéro ?')) return;
  localStorage.clear();
  sessionStorage.clear();
  location.reload(true);
};

loadLocal();
loadMetaIntoUI();
renderTemplates();
renderChapters();
loadChapterIntoEditor();
buildCurrentPreview();
window.addEventListener('beforeunload', saveLocal);
setStatus('Prêt. Écris ton livre !', 'ok');
</script>
